<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stretch &amp; Gym</title>
<meta name="description" content="Stretching, pull-ups and workouts. Works offline.">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151817" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Atkinson Hyperlegible';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-400.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-500.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-700.woff2) format('woff2')}
:root{
  --bg:#F3F4F1;--surface:#FFFFFF;--surface2:#F1F3EF;--ink:#1B1F1D;--muted:#5E6662;--line:#DADDD8;
  --accent:#0F7B6C;--accent-ink:#FFFFFF;--accent-soft:#DDEFEB;--warn-soft:#FBEBD8;--warn-line:#EBC79A;
  --fig-near:#1B1F1D;--fig-far:#A3ABA6;--fig-floor:#C9CEC9;--fig-prop:#9AA39E;--fig-mat:#E9ECE7;--fig-mat-line:#D3D8D2;
  --c-beine:#2BB5A0;--c-brust:#F28C28;--c-ruecken:#6FA8DC;--c-schulter:#F2E33A;--c-bauch:#EF5B5B;--c-multi:#C9CCCF;
  --st-wait:#B86E00;--st-err:#C43B3B;
  --radius:14px;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151817;--surface:#1F2321;--surface2:#262B29;--ink:#EEF1EE;--muted:#9AA39E;--line:#2E3431;
    --accent:#3CC9B0;--accent-ink:#0B1A17;--accent-soft:#1C3631;--warn-soft:#3A2A17;--warn-line:#6B4A22;
    --fig-near:#EEF1EE;--fig-far:#6B746F;--fig-floor:#3A403D;--fig-prop:#6B746F;--fig-mat:#262B29;--fig-mat-line:#363C39;--st-wait:#F0A443;--st-err:#F27878;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151817;--surface:#1F2321;--surface2:#262B29;--ink:#EEF1EE;--muted:#9AA39E;--line:#2E3431;
  --accent:#3CC9B0;--accent-ink:#0B1A17;--accent-soft:#1C3631;--warn-soft:#3A2A17;--warn-line:#6B4A22;
  --fig-near:#EEF1EE;--fig-far:#6B746F;--fig-floor:#3A403D;--fig-prop:#6B746F;--fig-mat:#262B29;--fig-mat-line:#363C39;--st-wait:#F0A443;--st-err:#F27878;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding-block:max(12px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-bottom));
  padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
h2,h3{margin:0}
.wrap{max-width:560px;margin:0 auto}
.muted{color:var(--muted)}

.app-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.app-head h1{font:700 32px/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.app-head .date{color:var(--muted);font-size:14px;margin-top:4px}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding-bottom:4px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
button.sync{border:0;background:none;padding:8px 0 8px 10px;margin-bottom:-4px;cursor:pointer;font:inherit;font-size:13px;color:var(--muted)}
.sync.ok::before,.st-line.ok::before{background:var(--accent)}
.sync.wait::before,.st-line.wait::before{background:var(--st-wait)}
.sync.err::before,.st-line.err::before{background:var(--st-err)}
.sync.busy::before,.st-line.busy::before{background:var(--accent);animation:blink .8s ease-in-out infinite alternate}
.sync.err{color:var(--st-err)}
@keyframes blink{to{opacity:.2}}
@media (prefers-reduced-motion: reduce){.sync.busy::before,.st-line.busy::before{animation:none}}
.dlg{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(480px,calc(100% - 32px));max-height:calc(100% - 32px)}
.dlg::backdrop{background:rgba(0,0,0,.5)}
.dlg-in{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.dlg-in p{margin:0}
.st-line{display:flex;gap:9px;align-items:baseline;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.st-line::before{content:"";width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.fld{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px}
.fld input{font-weight:400;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);min-height:46px;width:100%}
.small{font-size:13px}
.btns{display:flex;flex-direction:column;gap:8px}
.btns .btn{width:100%}

body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabbar button{flex:1;max-width:180px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:4px 0;font:700 13px/1.1 var(--body);color:var(--muted);cursor:pointer;border-radius:12px}
.tabbar i{display:grid;place-items:center;width:58px;height:32px;border-radius:16px}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] i{background:var(--accent-soft);color:var(--accent)}
.testbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.testbar b{font:700 17px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.testbar span{flex:1;min-width:160px;color:var(--muted)}
.testbar div{display:flex;gap:8px;margin-left:auto}
.testbar .btn{min-height:38px;padding:6px 12px;font-size:14px}
.studio{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;cursor:pointer;font-size:15px}
.studio span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.studio small{color:var(--muted);font-size:13px}
.studio em{font-style:normal;color:var(--accent);font-weight:700;font-size:14px}
.mrow .for{color:var(--muted);font-size:13px}
.st-chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px}
.st-chk input{width:20px;height:20px;accent-color:var(--accent)}
.pk-row .here{color:var(--muted);font-size:12px}
.sto .pk-img{display:grid;place-items:center;border-left:0;color:var(--muted)}
.sto .pk-img svg{width:22px;height:22px}
.studio > svg{width:22px;height:22px;flex:none;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.eyebrow{font-weight:700;font-size:12px;line-height:1.2;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.eyebrow.ok{color:var(--accent)}
.h2{font:700 36px/1 var(--display);margin:4px 0 3px;text-transform:uppercase}
.h3{font:700 24px/1.05 var(--display);margin:4px 0 2px;text-transform:uppercase}
.card > h3{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.top{align-items:flex-start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:56px;font:700 23px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;margin-top:14px}
.btn.ghost{background:transparent}
.btn.block{width:100%;margin-top:8px}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
:is(button,a,input,summary):focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--surface2);flex:none}
.seg button{border:0;background:none;min-width:42px;min-height:38px;border-radius:7px;font:700 20px/1 var(--display);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg.wide{display:flex;width:100%;margin-bottom:12px}
.seg.wide button{flex:1;font-size:19px;text-transform:uppercase;letter-spacing:.05em}

/* Figuren */
.fig polyline,.fig line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .near{stroke:var(--fig-near);stroke-width:7}
.fig .far{stroke:var(--fig-far);stroke-width:7}
.fig .torso{stroke:var(--fig-near);stroke-width:10}
.fig .thin{stroke-width:6}
.fig .head{fill:var(--fig-near)}
.fig .eye{fill:var(--fig-bg,var(--surface))}
.fig .floor{stroke:var(--fig-floor);stroke-width:3}
.fig .prop{stroke:var(--fig-prop);stroke-width:4}
.fig .thick{stroke-width:6}
.fig .band{stroke:var(--accent);stroke-width:4}
.fig .grip{fill:var(--accent)}
.fig .mat{fill:var(--fig-mat);stroke:var(--fig-mat-line)}
.fig .bosu{fill:var(--fig-mat-line);stroke:var(--fig-prop);stroke-width:2}
.fig .weight{fill:var(--accent)}
.fig .arc{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:14px}
.thumb{background:var(--surface2);--fig-bg:var(--surface2);border-radius:10px;aspect-ratio:240/204;overflow:hidden}
.thumb svg{display:block;width:100%;height:100%}

.week{display:flex;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);flex:1}
.wd i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.wd.on i{background:var(--accent);border-color:var(--accent)}
.wd.today{color:var(--ink);font-weight:700}

details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:15px;padding:6px 0}
.exl{list-style:none;margin:4px 0 0;padding:0}
.exl li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.exl .dur{color:var(--muted);white-space:nowrap;font-size:14px}
.exl a{font-size:14px;white-space:nowrap}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 .card{margin:0;display:flex;flex-direction:column;gap:8px;padding:14px}
.grid2 .thumb{margin-top:2px}
.grid2 .btn{margin-top:auto}

.pull .big-num{font:700 48px/1 var(--display);margin-top:4px}
.pull .big-num small{font:600 18px/1 var(--display);color:var(--muted);margin-left:4px}
.pull .goal{text-align:right}
.pull-btns{display:flex;gap:8px;margin-top:14px}
.pull-btns .btn{flex:1;min-width:0;min-height:52px;padding:0;font:700 22px/1 var(--display)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--line);margin-top:12px}
.meter b{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter i{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.grips{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:14px;color:var(--muted)}
.grips span{display:inline-flex;align-items:center;gap:6px}
.grips i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.grips b{color:var(--ink)}
.seg.grip{display:flex;margin-top:14px}
.seg.grip button{flex:1;font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.maxstep{display:flex;align-items:center;gap:8px;margin-top:14px}
.maxstep .btn.ghost{width:52px;min-height:52px;padding:0;font:700 28px/1 var(--display);flex:none}
.maxstep output{font:700 44px/1 var(--display);min-width:64px;text-align:center}
.maxstep .btn.primary{flex:1;min-height:52px;font:700 21px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.maxrows{margin-top:16px;display:grid;gap:10px}
.maxrow{display:grid;grid-template-columns:72px 1fr 92px;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.maxrow .meter{margin-top:0}
.maxrow .meter b{background:var(--c)}
.maxrow.today .nm{color:var(--ink);font-weight:700}
.maxrow .bv{text-align:right}
.maxrow .bv b{color:var(--ink)}

.rules ul{margin:0;padding-left:18px;font-size:15px}
.rules li+li{margin-top:4px}

/* Gym-Übersicht */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.stat b{display:block;font:700 28px/1 var(--display)}
.stat span{display:block;font-size:12px;line-height:1.25;color:var(--muted);margin-top:4px}
button.stat{cursor:pointer}
button.stat.on b{color:var(--accent)}
.banner{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:15px}
.banner b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.note{margin-top:10px;font-size:14px;color:var(--muted)}
.pairs{list-style:none;margin:12px 0 0;padding:0}
.pair{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.pair .num{font:700 20px/1.1 var(--display);color:var(--muted)}
.pair.opt{opacity:.7}
.mrow{display:flex;align-items:center;gap:8px;font-size:15px;min-height:22px}
.mrow+.mrow{margin-top:5px}
.dot{width:11px;height:11px;border-radius:3px;background:var(--gc,var(--c-multi));flex:none}
.mrow .kg{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.mrow .mini{width:52px;flex:none;border-radius:6px;background:var(--surface2);--fig-bg:var(--surface2);overflow:hidden}
.mrow .mini svg{display:block;width:100%}
.hist{border-top:1px solid var(--line)}
.hist summary{display:flex;justify-content:space-between;gap:10px;padding:10px 0;cursor:pointer;font-size:15px}
.hist summary span:last-child{color:var(--muted);white-space:nowrap}
.hist ul{margin:0 0 10px;padding-left:18px;font-size:14px;color:var(--muted)}
.hist ul b{color:var(--ink);font-weight:700}
.empty{color:var(--muted);font-size:15px}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-block:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-bottom));
  padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
.overlay[hidden]{display:none}
#player{z-index:30}
.ov-top{display:flex;align-items:center;gap:6px;width:100%}
.ov-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;line-height:1.15}
.ov-title b{font:700 21px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.ov-title span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed="false"]{color:var(--muted)}
.icon-btn.lg{width:56px;height:56px;border-radius:50%}
.icon-btn.lg svg{width:26px;height:26px}

.pl{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px}
.pl-bar{display:flex;gap:3px}
.pl-bar i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.pl-bar b{display:block;height:100%;width:0;background:var(--accent)}
.pl-stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:grid;place-items:center;padding:6px;cursor:pointer;flex:1 1 auto;min-height:170px}
.pl-stage svg{width:100%;max-height:min(38vh,330px);display:block}
.pl-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pl-name h2{font:700 31px/1.02 var(--display);text-transform:uppercase}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.chip:empty{display:none}
.pl-cue{margin:6px 0 0;color:var(--muted);font-size:16px;min-height:3em}
.pl-ctrl{display:flex;align-items:center;justify-content:center;gap:22px;padding:4px 0}
.ringbtn{position:relative;width:132px;height:132px;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:339.29}
.ringbtn.prep .fg{stroke:var(--muted)}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.ring-text b{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums}
.ring-text b.word{font-size:30px;text-transform:uppercase;letter-spacing:.04em}
.ring-text span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ring-text svg{width:16px;height:16px;color:var(--muted)}
.pl-foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pl-foot a{white-space:nowrap}
.pl-done{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px 0}
.pl.is-done .pl-run{display:none}
.pl.is-done .pl-done{display:flex}
.pl-done .check{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pl-done .check svg{width:44px;height:44px}
.pl-done h2{font:700 36px/1 var(--display);text-transform:uppercase}
.pl-done .btn{min-width:220px}

/* Trainings-Session */
.ss{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#ss-body{display:flex;flex-direction:column;gap:10px}
.ss-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.ss-bar b{display:block;height:100%;background:var(--accent)}
.pairlabel{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sticker{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sticker .band{background:var(--gc);color:#1B1F1D;font:700 22px/1 var(--display);letter-spacing:.06em;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.sticker .band small{font:700 15px/1 var(--display);letter-spacing:.04em}
.sticker .body{padding:14px}
.sticker h2{font:700 32px/1.02 var(--display);text-transform:uppercase}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.last{margin-top:10px;font-size:15px}
.hint{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:14px}
.hint.up{background:var(--accent-soft)}
.hint.down{background:var(--warn-soft)}
.stepper{display:grid;grid-template-columns:72px 54px 1fr 54px;align-items:center;gap:8px;margin-top:12px}
.stepper label{font-weight:700;font-size:15px}
.stepper button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font:700 28px/1 var(--display);cursor:pointer;padding:0}
.stepper input{height:54px;width:100%;min-width:0;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.done-sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.done-sets span{border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--surface2);font-variant-numeric:tabular-nums}
.sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sec h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.cues{margin:0;padding-left:18px;font-size:15px}
.cues li+li{margin-top:3px}
.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:10px 12px;font-size:16px}
.alts{display:flex;gap:6px;flex-wrap:wrap}
.alt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:36px}
.alt[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.bands{margin-top:12px}
.bands .lbl{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.links{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px}
.links a{display:inline-flex;gap:5px;align-items:center;font-weight:700}
.links svg{width:16px;height:16px}
.rest{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:12px 14px}
.rest b{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums;min-width:2.2ch}
.rest .txt{flex:1;font-size:14px;line-height:1.3}
.rest button{border:0;border-radius:10px;min-height:44px;padding:0 12px;font-weight:700;cursor:pointer;background:rgba(127,127,127,.28);color:inherit}
.rest button.go{background:var(--accent);color:var(--accent-ink)}
.ss-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.ss-photos:empty{display:none}
.pthumb{position:relative;display:block;width:68px;height:90px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2);cursor:zoom-in}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb span{position:absolute;right:4px;bottom:4px;min-width:20px;height:20px;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.taken{display:flex;gap:8px;margin-top:10px}
.taken .btn{flex:1;min-height:48px;padding:8px 10px;font-size:15px}
.waitbar{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.waitbar div{display:flex;flex-direction:column;font-size:15px;line-height:1.3}
.waitbar span{color:var(--muted);font-size:13px}
.waitbar .btn{flex:none}
/* Gym grid: every machine by colour; today's are outlined, done or "enough" ones sink to the bottom */
.gr-head{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 7px;font-size:13px;font-weight:700;background:var(--surface);font-variant-numeric:tabular-nums}
.chip::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--gc);flex:none}
.chip.ok{color:var(--muted);border-style:dashed}
.chip.pop{animation:cpop .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes cpop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:3px}
@media (min-width:480px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;cursor:pointer;min-height:150px;-webkit-appearance:none;appearance:none;transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .3s,filter .3s}
.tile.rec{border-color:transparent;box-shadow:0 0 0 3px var(--gc)}
.tile.busy{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.tile.full{opacity:.72}
.tile.enough{filter:grayscale(1);opacity:.42}
.tile .tb{display:flex;justify-content:space-between;align-items:center;gap:4px;background:var(--gc);color:#1B1F1D;font:700 13px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:6px 8px}
.tile .tb em{font-style:normal;font-size:12px}
.tile .ti{aspect-ratio:4/3;background:var(--surface2);--fig-bg:var(--surface2);display:grid;place-items:center;overflow:hidden}
.tile .ti img,.tile .ti svg{width:100%;height:100%;object-fit:cover;display:block}
.tile .ti small{font-size:11px;line-height:1.2;color:var(--muted);text-align:center;padding:6px}
.tile .tn{padding:6px 8px 0;font-size:13px;line-height:1.2;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tf{margin-top:auto;padding:5px 8px 7px;display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--accent)}
.tile.other{border-style:dashed;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:13px}
.tile.other svg{width:26px;height:26px}
.tdiv{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:12px 0 0;border-top:1px solid var(--line);margin-top:4px}
.tile.flash::after{content:"";position:absolute;inset:0;background:var(--gc);animation:tflash .6s steps(1,end) forwards}
@keyframes tflash{0%,20%,40%,60%,80%{opacity:.9}10%,30%,50%,70%,90%,100%{opacity:0}}
.tile.gone{animation:tgone .28s ease-in forwards}
@keyframes tgone{to{transform:scaleY(.06);opacity:0}}
.tile.arrive{animation:tarrive .45s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes tarrive{from{opacity:0;transform:translateY(28px) scale(.8)}to{transform:none}}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;flex:none}
.pair .num .dot{display:inline-block;margin-top:5px}
@media (prefers-reduced-motion:reduce){.tile,.chip{transition:none;animation:none!important}.tile::after{animation:none}}
.dlg.pk{width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px)}
.pk-list h4{margin:10px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.pk-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;border-radius:12px;background:none;padding:6px;cursor:pointer;min-height:56px}
.pk-row:hover{background:var(--surface2)}
.pk-row[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pk-row[hidden],.pk-list h4[hidden]{display:none}
.pk-img{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--surface2);border-left:5px solid var(--gc,var(--c-multi))}
.pk-img img{width:100%;height:100%;object-fit:cover;display:block}
.pk-img:has(img){border-left:0}
.pk-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.pk-t b{font-size:15px}
.pk-t small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-row .kg{color:var(--muted);font-size:13px;white-space:nowrap}
.pk-cam{position:relative;margin-top:0}
.pk-cam input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.pk-cam:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.pk-shot{display:flex;flex-direction:column;gap:8px}
.pk-shot img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:var(--surface2)}
.pk-fields{display:flex;flex-direction:column;gap:12px}
.pk-fields[hidden]{display:none}
.pv{position:fixed;inset:0;z-index:40;background:#000;color:#fff}
.pv[hidden]{display:none}
.pv-scroll{position:absolute;inset:0;overflow:auto;display:grid;place-items:center;overscroll-behavior:contain}
.pv-scroll img{max-width:100%;max-height:100%;display:block;cursor:zoom-in}
.pv.zoom .pv-scroll{display:block}
.pv.zoom .pv-scroll img{max-width:none;max-height:none;width:260%;cursor:zoom-out}
.pv-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left));
  background:linear-gradient(rgba(0,0,0,.7),transparent);font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;pointer-events:none}
.pv-top button,.pv-nav button{pointer-events:auto}
.pv .icon-btn{background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.3);color:#fff}
.pv-nav{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:18px;font-weight:700;pointer-events:none}
.pv-nav[hidden]{display:none}
.pv-nav .icon-btn{font:700 28px/1 var(--body)}
.ss-fig{background:var(--surface2);--fig-bg:var(--surface2);border-radius:10px;margin-top:12px}
.ss-fig svg{display:block;width:100%;max-height:200px}
.bigtime{font:700 72px/1 var(--display);font-variant-numeric:tabular-nums;text-align:center;margin:10px 0 4px}
.sumlist{list-style:none;margin:8px 0 0;padding:0}
.sumlist li{padding:8px 0;border-top:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;gap:10px}
.sumlist li span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* Stats. Series and heat colours checked with the dataviz palette validator (CVD, lightness, contrast) on these surfaces. */
:root{--grip-n:#008571;--grip-m:#2a78d6;--grip-w:#eb6834;--grip-x:#8A928D;--viz-1:#008571;--viz-2:#eb6834;--heat-1:#6DBFAE;--heat-2:#2E9783;--heat-3:#006B59;--grid:#E6E8E4;--axis:#C3C7C1;--good-ink:#006300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--grip-n:#1FA88F;--grip-m:#3987e5;--grip-w:#d95926;--grip-x:#6E7671;--viz-1:#1FA88F;--viz-2:#d95926;--heat-1:#1B7565;--heat-2:#1FA88F;--heat-3:#4FD6BC;--grid:#2A2F2C;--axis:#444B47;--good-ink:#0ca30c}}
:root[data-theme="dark"]{--grip-n:#1FA88F;--grip-m:#3987e5;--grip-w:#d95926;--grip-x:#6E7671;--viz-1:#1FA88F;--viz-2:#d95926;--heat-1:#1B7565;--heat-2:#1FA88F;--heat-3:#4FD6BC;--grid:#2A2F2C;--axis:#444B47;--good-ink:#0ca30c}
.seg.range button{font-size:16px;letter-spacing:.03em;min-height:36px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .lbl{font-size:13px;color:var(--muted);line-height:1.25}
.kpi .val{font:700 34px/1 var(--display);margin-top:5px}
.kpi .val small{font:600 16px/1 var(--display);color:var(--muted);margin-left:4px}
.kpi .dl{font-size:13px;margin-top:5px;color:var(--muted);line-height:1.25}
.kpi .dl.up{color:var(--good-ink)}
.kpi .dl.down{color:var(--st-err)}
.card .cap{color:var(--muted);font-size:14px;margin:-4px 0 8px}
.chart{display:block;width:100%;overflow:visible;touch-action:pan-y}
.chart text{font:12px/1 var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .goal{stroke:var(--muted);stroke-width:1}
.chart .lab{fill:var(--ink);font-weight:700}
.chart [data-tip]{outline:none}
.chart [data-tip]:hover .m,.chart [data-tip]:focus-visible .m{filter:brightness(1.15)}
.chart [data-tip]:focus-visible .hit{stroke:var(--accent);stroke-width:2}
.chart .hit{fill:transparent}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{opacity:.1}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1;pointer-events:none}
.chart .cell0{fill:var(--surface2)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .ln{width:14px;height:0;border-top:1px solid var(--muted);border-radius:0;vertical-align:3px}
.vtip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:8px 10px;font-size:13px;line-height:1.35;max-width:250px}
.vtip[hidden]{display:none}
.vtip .t{color:var(--muted);margin-bottom:2px}
.vtip .r{display:flex;align-items:baseline;gap:7px}
.vtip .r b{font-size:15px}
.vtip .r span{color:var(--muted)}
.vtip .k{width:12px;height:0;border-top:2px solid;flex:none;align-self:center}
details.tv{margin-top:8px}
details.tv summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0}
.tv-scroll{max-height:320px;overflow:auto}
.tv table{width:100%;border-collapse:collapse;font-size:14px}
.tv th,.tv td{text-align:right;padding:5px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tv th:first-child,.tv td:first-child{text-align:left}
.tv th{font-size:12px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--surface)}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px}
.sm h4{margin:0;font-size:14px;line-height:1.25;font-weight:700}
.sm .v{font:700 24px/1 var(--display);margin-top:4px}
.sm .d{font-size:12px;color:var(--muted);margin-top:2px}
.sm .d.up{color:var(--good-ink)}
.sm .chart{margin-top:4px}
.heat-legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.heat-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
@media (max-width:380px){
  .stats b{font-size:24px}
  .ringbtn{width:116px;height:116px}
  .ring-text b{font-size:40px}
}
.pl-media{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:8px;flex:1 1 auto;min-height:170px}
.pl-media.novid{grid-template-columns:minmax(0,1fr)}
.pl-media .pl-stage{min-height:0}
.pl-vid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 8px;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);text-decoration:none}
.pl-vid[hidden]{display:none}
.pl-vid:hover{border-color:var(--accent)}
.pl-vid .yt{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pl-vid .yt svg{width:26px;height:26px;margin-left:3px}
.pl-vid b{font:700 18px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em}
.pl-vid small{font-size:12px;line-height:1.3;color:var(--muted)}
@media (min-width:700px){
  .pl{max-width:860px}
  .pl-media{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
  .pl-vid b{font-size:24px}
  .pl-vid .yt{width:72px;height:72px}
  .pl-vid .yt svg{width:34px;height:34px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="app-head">
    <div>
      <h1>Stretch &amp; Gym</h1>
      <div class="date" id="today"></div>
    </div>
    <button type="button" class="sync" id="sync" data-act="sync-open" aria-haspopup="dialog">On this phone</button>
  </header>
  <div id="testbar"></div>
  <main>
    <div id="tab-dehnen" role="tabpanel" aria-label="Daily"></div>
    <div id="tab-gym" role="tabpanel" aria-label="Workout" hidden></div>
    <div id="tab-stats" role="tabpanel" aria-label="Stats" hidden></div>
  </main>
</div>
<nav class="tabbar" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="dehnen" aria-selected="true"><i id="ti-dehnen"></i>Daily</button>
  <button role="tab" data-tab="gym" aria-selected="false"><i id="ti-gym"></i>Workout</button>
  <button role="tab" data-tab="stats" aria-selected="false"><i id="ti-stats"></i>Stats</button>
</nav>
<div class="vtip" id="vtip" role="tooltip" hidden></div>

<div id="player" class="overlay" hidden>
  <div class="pl" id="pl">
    <div class="ov-top">
      <button class="icon-btn" data-act="pl-close" aria-label="Close" id="pl-x"></button>
      <div class="ov-title"><b id="pl-seq"></b><span id="pl-count"></span></div>
      <button class="icon-btn" data-act="pl-sound" id="pl-sound" aria-label="Sounds"></button>
      <button class="icon-btn" data-act="pl-voice" id="pl-voice" aria-label="Voice cues"></button>
    </div>
    <div class="pl-bar" id="pl-bar"></div>
    <div class="pl-media pl-run" id="pl-media">
      <div class="pl-stage" data-act="pl-toggle"><svg class="fig" id="pl-fig" viewBox="0 -14 240 204" aria-hidden="true"></svg></div>
      <a class="pl-vid" id="pl-vid" target="_blank" rel="noopener"><span class="yt" id="pl-vid-icon"></span><b>Watch video</b><small>Opens YouTube in a new tab</small></a>
    </div>
    <div class="pl-run">
      <div class="pl-name"><h2 id="pl-name"></h2><span class="chip" id="pl-side"></span></div>
      <p class="pl-cue" id="pl-cue"></p>
    </div>
    <div class="pl-ctrl pl-run">
      <button class="icon-btn lg" data-act="pl-prev" aria-label="Back" id="pl-prev"></button>
      <button class="ringbtn" data-act="pl-play" id="pl-ring" aria-label="Start or pause">
        <svg class="ring" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="pl-arc" cx="60" cy="60" r="54"/></svg>
        <span class="ring-text"><span id="pl-label"></span><b id="pl-time"></b><span id="pl-state"></span></span>
      </button>
      <button class="icon-btn lg" data-act="pl-next" aria-label="Next" id="pl-next-btn"></button>
    </div>
    <div class="pl-foot pl-run"><span id="pl-next"></span></div>
    <div class="pl-done">
      <div class="check" id="pl-check"></div>
      <h2 id="pl-done-title">Done</h2>
      <div class="sub" id="pl-done-sub"></div>
      <button class="btn primary big" data-act="pl-close" id="pl-done-btn">Done</button>
    </div>
  </div>
</div>

<div id="session" class="overlay" hidden>

<script>
const FIG = (() => {
// Strichfiguren-Engine: Posen als absolute Winkel (SVG-Grad, 0 = rechts, 90 = unten) oder IK-Ziele.
const SEG = { t1: 26, t2: 26, nk: 9, hr: 11, ua: 27, fa: 25, th: 42, sh: 40, ft: 11 };
const FLOOR = 182;
const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;
const pt = (p, a, l) => [p[0] + l * Math.cos(rad(a)), p[1] + l * Math.sin(rad(a))];
const ang = (a, b) => deg(Math.atan2(b[1] - a[1], b[0] - a[0]));

function ik(root, target, l1, l2, bend) {
  const dx = target[0] - root[0], dy = target[1] - root[1];
  let d = Math.hypot(dx, dy);
  const base = Math.atan2(dy, dx);
  if (d >= l1 + l2 - 0.01) return [root[0] + l1 * Math.cos(base), root[1] + l1 * Math.sin(base)];
  d = Math.max(d, Math.abs(l1 - l2) + 0.01);
  const a = Math.acos(Math.min(1, Math.max(-1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const t = base + bend * a;
  return [root[0] + l1 * Math.cos(t), root[1] + l1 * Math.sin(t)];
}

function limb(root, spec, l1, l2, sk) {
  const k = spec.k ?? 1;
  if (spec.to) {
    let T = typeof spec.to === 'string' ? sk[spec.to] : spec.to;
    if (spec.dx) T = [T[0] + spec.dx[0], T[1] + spec.dx[1]];
    const j = ik(root, T, l1 * (spec.ka ?? k), l2 * (spec.kb ?? k), spec.bend ?? 1);
    return { j, e: pt(j, ang(j, T), l2 * (spec.kb ?? k)) };
  }
  const j = pt(root, spec.a, l1 * (spec.ka ?? k));
  return { j, e: pt(j, spec.b, l2 * (spec.kb ?? k)) };
}

function solve(pose) {
  const v = pose.view || 'side';
  const lat = v === 'front' || v === 'back' ? [1, 0] : v === 'top' ? [0, 1] : [0, 0];
  const sw = pose.sw ?? (v === 'side' ? 0 : 15);
  const hw = pose.hw ?? (v === 'side' ? 0 : 9);
  const tk = pose.tk ?? 1;
  const sR = v === 'front' ? -1 : 1;
  const depth = v === 'side' ? (pose.depth || [3, -2]) : [0, 0];
  const off = (b, s, w) => s === 'R'
    ? [b[0] + sR * w * lat[0], b[1] + sR * w * lat[1]]
    : [b[0] - sR * w * lat[0] + depth[0], b[1] - sR * w * lat[1] + depth[1]];
  const hip = pose.hip;
  const mid = pt(hip, pose.t[0], SEG.t1 * tk);
  const neck = pt(mid, pose.t[1], SEG.t2 * tk);
  const head = pt(neck, pose.n ?? pose.t[1], (SEG.nk + SEG.hr) * (pose.nk ?? 1));
  const sk = { view: v, hip, mid, neck, head, face: pose.face ?? ((pose.n ?? pose.t[1]) + 90) };
  for (const s of ['R', 'L']) {
    const root = off(hip, s, hw);
    const r = limb(root, pose['l' + s], SEG.th, SEG.sh, sk);
    sk['hip' + s] = root; sk['knee' + s] = r.j; sk['ankle' + s] = r.e;
    const fa = pose['l' + s].f ?? (ang(r.j, r.e) - 90);
    sk['toe' + s] = v === 'side' ? pt(r.e, fa, SEG.ft) : null;
  }
  for (const s of ['R', 'L']) {
    const root = off(neck, s, sw);
    const r = limb(root, pose['a' + s], SEG.ua, SEG.fa, sk);
    sk['sh' + s] = root; sk['elb' + s] = r.j; sk['hand' + s] = r.e;
  }
  return sk;
}

function lerp(a, b, t) {
  if (typeof a === 'number' && typeof b === 'number') return a + (b - a) * t;
  if (Array.isArray(a)) return a.map((x, i) => lerp(x, b[i], t));
  if (a && typeof a === 'object') {
    const o = {};
    for (const k in a) o[k] = k in b ? lerp(a[k], b[k], t) : a[k];
    return o;
  }
  return a;
}

const f1 = n => Math.round(n * 10) / 10;
const line = (a, b, c) => `<line class="${c}" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"/>`;
const poly = (ps, c) => `<polyline class="${c}" points="${ps.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ')}"/>`;

function drawFigure(sk) {
  const side = sk.view === 'side';
  const far = side ? 'far' : 'near';
  const leg = (s, c) => poly([sk['hip' + s], sk['knee' + s], sk['ankle' + s]].concat(sk['toe' + s] ? [sk['toe' + s]] : []), c);
  const arm = (s, c) => poly([sk['sh' + s], sk['elb' + s], sk['hand' + s]], c);
  let g = '';
  g += leg('L', far) + arm('L', far);
  g += poly([sk.hip, sk.mid, sk.neck], 'torso');
  if (!side) g += line(sk.shR, sk.shL, 'torso thin') + line(sk.hipR, sk.hipL, 'torso thin');
  g += `<circle class="head" cx="${f1(sk.head[0])}" cy="${f1(sk.head[1])}" r="${SEG.hr}"/>`;
  if (side || sk.view === 'top') {
    const n = pt(sk.head, sk.face, SEG.hr - 3.5);
    g += `<circle class="eye" cx="${f1(n[0])}" cy="${f1(n[1])}" r="2.6"/>`;
  }
  g += leg('R', 'near') + arm('R', 'near');
  return g;
}

// Pull-up from the front. dx = half the grip width. Dead hang with straight arms, then up until the head reaches the bar.
function pullup(dx) {

  const legs = { lR: { a: 93, b: 90, kb: 0.4 }, lL: { a: 87, b: 90, kb: 0.4 } };
  const arms = ka => ({ aR: { to: [120 - dx, bar + 2], ka, bend: -1 }, aL: { to: [120 + dx, bar + 2], ka, bend: 1 } });
  return {
    cycle: 3, props: () => P.cbar(bar),
    frames: [
      { view: 'front', hip: [120, hang], t: [-90, -90], n: -90, ...arms(1), ...legs },
      { view: 'front', hip: [120, bar + 66], t: [-90, -90], n: -90, ...arms(0.6), ...legs },
    ],
  };
}

// ---------- Gym grid: every machine of the studio, by colour ----------
// A gym workout is a grid of all the studio's machines, sorted by colour (muscle group). Today's plan
// machines are outlined. 3 sets on one machine, then the next. Once as many machines of a colour are done
// as the plan asks for, the rest of that colour turns grey and sinks to the bottom, next to the done ones.
const COLORS = [['var(--c-beine)', 'Legs & glutes'], ['var(--c-brust)', 'Chest'], ['var(--c-ruecken)', 'Back'], ['var(--c-schulter)', 'Shoulders & arms'], ['var(--c-bauch)', 'Abs & lower back'], ['var(--c-multi)', 'Multi']];
const COLOR_NAME = Object.fromEntries(COLORS), colorRank = c => COLORS.findIndex(x => x[0] === c);
const colorOf = id => G[M[id].g].c, gRank = id => Object.keys(G).indexOf(M[id].g);

const wait = ms => new Promise(r => setTimeout(r, ms));
// Today's machines: the plan's (with a stand-in where the studio lacks one), then the extra (calf raise) and the Bosu.
function recsFor(plan, sid) {
  const out = [], seen = new Set();
  for (const [list, extra] of [[PLAN[plan].pairs.flat(), false], [[...EXTRA, 'bosu'], true]])
    for (const def of list) { const id = swapFor(def, sid); if (!seen.has(id)) { seen.add(id); out.push({ id, def, extra }); } }
  return out;
}

    const ids = [...new Set([...Object.keys(M).filter(id => !M[id].home && atStudio(id, sid)), ...recs.map(r => r.id), ...(S.more || [])])].filter(id => M[id] && !M[id].home);
    const today = {}; for (const x of S.sets) today[x.ex] = (today[x.ex] || 0) + 1;
    const quota = {}, done = {};
    for (const r of recs) quota[colorOf(r.id)] = (quota[colorOf(r.id)] || 0) + 1;
    for (const id of ids) if ((today[id] || 0) >= setsOf(id)) done[colorOf(id)] = (done[colorOf(id)] || 0) + 1;

// ---------- Storage: on the phone first, then copied to GitHub (sync.js) ----------
const COLLS = ['days', 'sessions', 'machines', 'settings'];

  },
  get(path) { return LS.get('doc.' + path, null); },
  // Write without marking for upload (used for documents that came from the repo).
  raw(path, body) {
    const [coll, id] = path.split('/');
    const idx = LS.get('idx.' + coll, []);
    if (body == null) { LS.set('doc.' + path, null); LS.set('idx.' + coll, idx.filter(x => x !== id)); return; }
    if (!LS.set('doc.' + path, body)) toast('Phone storage is full – nothing was saved.');
    if (!idx.includes(id)) { idx.push(id); LS.set('idx.' + coll, idx); }
  },
  put(path, data) {
    const body = clone(data); delete body.id;
    this.raw(path, body);

  paths() { return COLLS.flatMap(c => LS.get('idx.' + c, []).map(id => c + '/' + id)); },
};
// Apply a document that came from the repo to the in-memory data too, so a tap right after
// a pull can't write back an older copy.
function applyDoc(path, doc) {
  Store.raw(path, doc);

  if (coll === 'days') { if (doc) D.days[id] = { date: id, pullups: [], stretch: [], walk: false, ...doc }; else delete D.days[id]; }
  else if (coll === 'machines') { if (doc) { D.machines[id] = { ...doc, id }; addCustom(id, doc); } else delete D.machines[id]; }
  else if (coll === 'settings') { if (doc) D.settings[id] = doc; else delete D.settings[id]; }
  else if (coll === 'sessions') {

async function readQR(img) {
  if (!('BarcodeDetector' in window)) return { unsupported: true };
  try {
    const codes = await new BarcodeDetector({ formats: ['qr_code'] }).detect(img);
    for (const c of codes) {
      const v = c.rawValue || '', m = /fitinn\.at\/qr\/([a-z0-9]+)/i.exec(v), t = /fitinn\.at\/training\/([a-z0-9_]+)/i.exec(v);
      if (m) return { id: m[1].toLowerCase() };
      if (t && BY_SLUG[t[1].toLowerCase()]) return { id: BY_SLUG[t[1].toLowerCase()] };
    }
    return { other: codes.length > 0 };
  } catch (e) { console.warn('qr', e); return {}; }
}
// Phone photos are 3–12 MB; the repo keeps them at about the size of the existing ones (1200 px).
function shrink(img, max = 1200) {
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r({ blob: b, canvas: c }), 'image/jpeg', 0.8));
}

  const maxRow = g => {
    const list = tests.filter(x => x.grip === g), nm = GRIPS[g].name + ' grip';
    if (!list.length) return `<div class="sm"><h4>${nm}</h4><div class="d">No max test in this period</div></div>`;
    const lastV = list[list.length - 1].n, d = lastV - list[0].n;
    const delta = list.length < 2 ? '1 test' : d ? `${d > 0 ? '▲ +' : '▼ −'}${plural(Math.abs(d), 'rep', 'reps')} since ${fmtDM(list[0].k)}` : `Same as ${fmtDM(list[0].k)}`;
    const togo = Math.max(0, MAX_GOAL - lastV);
    return `<div class="sm"><h4>${nm}</h4><div class="v">${plural(lastV, 'rep', 'reps')}</div><div class="d${d > 0 ? ' up' : ''}">${delta} · ${togo ? togo + ' to go' : 'goal reached'}</div>
      ${lineChart({ id: 'max-' + g, W, H: 84, pts: list.map(x => ({ k: x.k, v: x.n, title: fmtDate(x.k), rows: [{ v: plural(x.n, 'clean rep', 'clean reps'), l: nm.toLowerCase(), c: GRIPS[g].c }] })), from, to, small: true, c: GRIPS[g].c, goal: MAX_GOAL, label: nm + ' max test' })}</div>`;
  };
  const maxes = `<section class="card"><h3>Max test per grip</h3>
    <p class="cap">${tests.length ? `Clean reps in one set · goal ${MAX_GOAL} in each grip (top line) · ${fmtDM(from)} – ${fmtDM(to)}` : 'No max tests in this period yet. You’ll find the test on the Daily tab, under the pull-up counter.'}</p>
    ${tests.length ? `<div class="multi" style="grid-template-columns:minmax(0,1fr)">${GRIP_KEYS.map(maxRow).join('')}</div>` + tv(['Date', 'Grip', 'Clean reps'], tests.slice().reverse().map(x => [fmtDate(x.k), GRIPS[x.grip].name, x.n])) : ''}</section>`;
  // Training volume per gym workout (kg × reps over all sets).
  const gses = ses.filter(isGym).filter(s => s.sets.some(x => x.kg != null));
  const vol = s => s.sets.reduce((a, x) => a + (x.kg || 0) * x.reps, 0);
  const volume = `<section class="card"><h3>Volume per gym workout</h3>
    <p class="cap">All sets added up: weight × reps. Rises as you add weight or reps.</p>
    ${gses.length ? lineChart({ id: 'vol', W, pts: gses.map(s => ({ k: s.date, v: vol(s), title: `${fmtDate(s.date)} · ${planName(s)}`, rows: [{ v: fmtVol(vol(s)) + ' kg', l: plural(s.sets.length, 'set', 'sets'), c: 'var(--viz-1)' }] })), from, to, fmt: fmtVol, label: 'Volume per gym workout' })
      + tv(['Date', 'Workout', 'Sets', 'Volume (kg)'], gses.slice().reverse().map(s => [fmtDate(s.date), h(planName(s)), s.sets.length, Math.round(vol(s)).toLocaleString('en-GB')]))
      : '<p class="empty">No gym workouts in this period yet.</p>'}</section>`;
  // Strength per exercise: small multiples, each on its own scale, all over the same period.
  const byEx = {};
  for (const s of ses) for (const x of s.sets) {
    const e = (byEx[x.ex] = byEx[x.ex] || {}), l = (e[s.id] = e[s.id] || { k: s.date, sets: [] }); l.sets.push(x);
  }
  const cols = W >= 320 ? 2 : 1, sw = Math.floor((W - 12 * (cols - 1)) / cols);
  const exRows = [];
  const multiple = (ex, gym) => {
    const m = M[ex], list = Object.values(byEx[ex]).sort((a, b) => a.k.localeCompare(b.k));
    const kind = gym ? 'kg' : m.load === 'bw' ? 'reps' : 'band';
    const val = l => kind === 'kg' ? Math.max(...l.sets.map(x => x.kg ?? 0)) : kind === 'reps' ? Math.max(...l.sets.map(x => x.reps)) : bandLevel(l.sets);
    const show = v => kind === 'kg' ? kgFmt(v) : kind === 'reps' ? plural(v, 'rep', 'reps') : v ? BANDS[BAND_KEYS[v - 1]] + ' band' : 'Bodyweight';
    const pts = list.map(l => ({ k: l.k, v: val(l), title: fmtDate(l.k), rows: [{ v: show(val(l)), l: kind === 'kg' ? 'top set · ' + setsText(l.sets) : kind === 'reps' ? 'best set' : 'top band · ' + l.sets.map(x => x.reps).join(' / ') + ' reps', c: 'var(--viz-1)' }] }));
    const first = pts[0].v, lastV = pts[pts.length - 1].v, d = lastV - first;
    for (const p of pts) exRows.push([h(m.name), fmtDate(p.k), show(p.v)]);
    const delta = pts.length < 2 ? plural(pts.length, 'workout', 'workouts') : d ? `${d > 0 ? '▲ +' : '▼ −'}${kind === 'kg' ? kgFmt(Math.abs(d)) : kind === 'reps' ? plural(Math.abs(d), 'rep', 'reps') : plural(Math.abs(d), 'band step', 'band steps')} since ${fmtDM(pts[0].k)}` : `Same as ${fmtDM(pts[0].k)}`;
    return `<div class="sm"><h4>${h(m.name)}</h4><div class="v">${h(show(lastV))}</div><div class="d${d > 0 ? ' up' : ''}">${delta}</div>
      ${lineChart({ id: 'ex-' + ex, W: sw, H: 84, pts, from, to, fmt: kind === 'band' ? v => BAND_SHORT[v] ?? '' : kind === 'kg' ? v => num(v) : num, zero: false, small: true, label: m.name })}</div>`;
  };
  const rank = ids => ids.sort((a, b) => Object.keys(byEx[b]).length - Object.keys(byEx[a]).length || M[a].name.localeCompare(M[b].name));
  const gymEx = rank(Object.keys(byEx).filter(ex => M[ex] && !M[ex].home)), homeEx = rank(Object.keys(byEx).filter(ex => M[ex] && M[ex].home));
  const strength = `<section class="card"><h3>Strength per exercise</h3>
    <p class="cap">${gymEx.length || homeEx.length ? `Gym: heaviest set each workout. Home: best set, or the strongest band. ${fmtDM(from)} – ${fmtDM(to)}.` : 'No workouts in this period yet.'}</p>
    ${gymEx.length ? `<div class="multi" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${gymEx.map(ex => multiple(ex, true)).join('')}</div>` : ''}
    ${homeEx.length ? `${gymEx.length ? '<h4 class="eyebrow" style="margin:18px 0 8px">At home</h4>' : ''}<div class="multi" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${homeEx.map(ex => multiple(ex, false)).join('')}</div>` : ''}
    ${exRows.length ? tv(['Exercise', 'Date', 'Best'], exRows) : ''}</section>`;
  el.innerHTML = range + kpis + workouts + stretch + pulls + maxes + volume + strength;
}
let statsResize = 0;
window.addEventListener('resize', () => { clearTimeout(statsResize); statsResize = setTimeout(() => { if (tab === 'stats') renderStats(); }, 150); });
const vtTarget = e => e.target.closest && e.target.closest('#tab-stats [data-tip], #tab-stats [data-line]');
function vtPoint(e) {
  const t = vtTarget(e);
  if (!t) { if (!$('#vtip').hidden) hideTip(); return; }
  if (t.dataset.line) return lineAt(t, e.clientX);
  hideTip(); showTip(+t.dataset.tip, e.clientX, e.clientY);
}
document.addEventListener('pointermove', vtPoint);
document.addEventListener('pointerdown', vtPoint);
document.addEventListener('focusin', e => {
  const t = vtTarget(e); if (!t) return;
  if (t.dataset.line) return lineAt(t);
  const r = t.getBoundingClientRect(); hideTip(); showTip(+t.dataset.tip, r.left + r.width / 2, r.top);
});
document.addEventListener('focusout', e => { if (vtTarget(e)) hideTip(); });
window.addEventListener('scroll', () => { if (!$('#vtip').hidden && !document.activeElement?.closest?.('#tab-stats')) hideTip(); }, { passive: true });

// ---------- Test mode ----------
function testSeed(force) {
  if (!TEST || (!force && LS.get('seeded', null))) return;
  const keys = Object.keys(localStorage);
  if (force) for (const k of keys) if (k.startsWith('dgtest.')) localStorage.removeItem(k);
  for (const k of keys) if (/^dg\.(doc\.|idx\.|prefs$|place$|studioToday$)/.test(k)) localStorage.setItem('dgtest.' + k.slice(3), localStorage.getItem(k));
  LS.set('seeded', new Date().toISOString());
}
// Made-up workouts for trying the Stats screen on a device without real data. Test mode only.
function testSample() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const kg = {}, start = addDays(mondayOf(new Date()), -7 * 15), sid = curStudio();
  let plan = 'A', n = 0, mi = 0;
  for (let d = new Date(start); dkey(d) < TODAY(); d = addDays(d, 1)) {
    const k = dkey(d), wd = (d.getDay() + 6) % 7, day = dayDoc(k);
    if (rnd() < 0.7) day.stretch.push({ seq: 'morgen' + (rnd() < 0.5 ? 'A' : 'B'), at: k + 'T07:10:00.000Z' });
    for (let j = 0; j < (wd < 5 ? Math.floor(rnd() * 3) : 0); j++) day.stretch.push({ seq: 'schreibtisch', at: k + 'T1' + (2 + j * 3) + ':00:00.000Z' });
    if (rnd() < 0.6) day.pullups.push({ n: 6 + Math.floor(rnd() * 12), grip: GRIP_KEYS[Math.floor(rnd() * 3)], at: k + 'T18:00:00.000Z' });
    if (rnd() < 0.8) { const g = GRIP_KEYS[mi++ % 3], base = { n: 6, m: 8, w: 5 }[g]; day.pullups.push({ n: base + Math.floor(mi / 9) + Math.floor(rnd() * 2), grip: g, max: true, at: k + 'T07:30:00.000Z' }); }
    if (rnd() < 0.2) { day.walk = true; day.walkAt = k + 'T17:00:00.000Z'; }
    const home = wd === 5 && rnd() < 0.5;
    if (!([0, 2, 4].includes(wd) && rnd() < 0.8) && !home) { saveDay(k); continue; }
    const pl = home ? 'home' : 'gym', p = plansOf(pl)[plan], sets = [];
    for (const pr of p.pairs) for (const ex of pr) for (let s = 1; s <= 3; s++) {
      const m = M[ex], r = rangeOf(ex);
      if (!m.home) { kg[ex] = kg[ex] ?? (m.start || 20 + Math.round(rnd() * 8) * 2.5); sets.push({ ex, kg: kg[ex], reps: r[0] + Math.floor(rnd() * (r[1] - r[0] + 1)), at: k + 'T18:00:00.000Z' }); }
      else sets.push({ ex, ...(m.load === 'bw' ? {} : { band: BAND_KEYS[Math.min(4, Math.floor(n / 6))] }), reps: r[0] + Math.floor(rnd() * (r[1] - r[0] + 1)), at: k + 'T18:00:00.000Z' });
    }
    for (const ex of Object.keys(kg)) if (rnd() < 0.3) kg[ex] += stepOf(ex);
    const id = `${k}-${home ? 'home' : ''}${plan}-sample${n++}`;
    const doc = { date: k, plan, place: pl, ...(home || !sid ? {} : { studio: sid }), startedAt: k + 'T17:00:00.000Z', endedAt: k + 'T17:50:00.000Z', sets, subs: {}, test: false, cooled: rnd() < 0.5 };
    if (doc.cooled) day.stretch.push({ seq: 'cooloff', at: k + 'T17:55:00.000Z' });
    Store.put('sessions/' + id, doc); upsertSession({ ...clone(doc), id });
    saveDay(k); plan = plan === 'A' ? 'B' : 'A';
  }
  toast('Sample data added (test mode only).'); renderAll();
}
function renderTestbar() {
  if (!TEST) return;
  const empty = !logged().length;
  $('#testbar').innerHTML = `<div class="testbar"><b>Test mode</b><span>Separate from your real data, never synced.</span>
    <div>${empty ? '<button class="btn" data-act="test-sample">Add sample data</button>' : ''}<button class="btn" data-act="test-reset">Reset</button><a class="btn ghost" href="${location.pathname}${location.hash}">Leave</a></div></div>`;
}

// ---------- Events ----------
const ACT = {
  'max-dn': () => MX.step(-1), 'max-up': () => MX.step(1), 'max-save': () => MX.save(),
  'max-edit': () => { MX.edit = true; MX.draft = null; renderDehnen(); },
  'pl-close': () => PL.close(), 'pl-play': () => PL.toggle(), 'pl-toggle': () => PL.toggle(),
  'pl-prev': () => PL.prev(), 'pl-next': () => PL.next(),
  'pl-sound': () => { prefs.sound = !prefs.sound; LS.set('prefs', prefs); PL.icons(); if (prefs.sound) beep(); },
  'pl-voice': () => { prefs.voice = !prefs.voice; LS.set('prefs', prefs); PL.icons(); if (!prefs.voice) hush(); else speak('Voice on.'); },
  'ss-start': () => SS.start(place, gymSel || nextPlan(place)),
  'ss-resume': () => SS.resume(),
  'ss-new': () => { closeOpenSession(); gymSel = null; SS.start(place, nextPlan(place)); },
  'ss-close': () => { if (SS.S && SS.S.endedAt) { SS.S = null; LS.set('cur', null); } SS.close(); },
  'ss-finish': () => SS.finishNow(),
  'warm-toggle': () => { const S = SS.S; if (S.warmEnd) { S.warmLeft = Math.max(0, S.warmEnd - Date.now()); S.warmEnd = 0; } else { S.warmEnd = Date.now() + (S.warmLeft || warmMs(S.place)); } SS.saveLocal(); SS.render(); },
  'warm-done': () => { SS.S.warmEnd = 0; SS.grid ? SS.goView('grid') : SS.go(1, 0); },
  'gr-back': () => SS.goView('grid', null, SS.restLeft()),
  'gr-other': () => PK.open(),
  'gr-cool': () => SS.goView('cool'),
  'kg-': () => SS.bump('kg', -1), 'kg+': () => SS.bump('kg', 1),
  'reps-': () => SS.bump('reps', -1), 'reps+': () => SS.bump('reps', 1),
  'save-set': () => SS.saveSet(), 'undo-set': () => SS.undoSet(),
  'skip-set': () => SS.go(SS.nextIdx(SS.S.step), 0),
  'ss-later': () => SS.later(), 'ss-pick': () => PK.open(),
  'studio-open': () => STD.open(), 'sto-close': () => STD.close(),
  'test-sample': () => testSample(),
  'test-reset': async () => { testSeed(true); try { await caches.delete('photos-test'); } catch {} location.reload(); },
  'pk-close': () => PK.close(), 'pk-new': () => PK.form(), 'pk-back': () => { PK.reset(); PK.list(); }, 'pk-add': () => PK.add(),
  'rest-plus': () => { SS.S.restUntil += 15000; SS.saveLocal(); SS.tick(); },
  'rest-skip': () => { SS.S.restUntil = 0; SS.saveLocal(); const r = $('#rest'); if (r) r.remove(); },
  'extra-yes': () => { SS.S.skipExtra = false; SS.go(SS.S.step + 1, 0); },
  'extra-no': () => { SS.S.skipExtra = true; SS.go(SS.nextIdx(SS.S.step), 0); },
  'cool-start': () => { PL.open('cooloff', 'gym'); PL.start(); },
  'cool-skip': () => SS.grid ? SS.goView('done') : SS.go(SS.S.step + 1, 0),
  'pv-close': () => PV.close(), 'pv-prev': () => PV.step(-1), 'pv-next': () => PV.step(1),
  'sync-open': () => openSyncDlg(),
  'sync-save': () => saveSyncCfg(),
  'sync-now': () => Sync.run(),
  'sync-off': () => { Sync.disconnect(); toast('Disconnected. Data stays on this phone.'); },
  'sync-backup': () => downloadBackup(),
  'walk': () => {
    const d = dayDoc(); d.walk = !d.walk;
    if (d.walk) d.walkAt = new Date().toISOString(); else delete d.walkAt;
    saveDay(); renderGym(); if (d.walk) toast('Walk logged.');
  },
};
document.addEventListener('click', e => {
  if (e.target.id === 'pv-img') return PV.zoom(e);
  const t = e.target.closest('[data-act],[data-play],[data-variant],[data-pull],[data-tab],[data-plan],[data-alt],[data-place],[data-band],[data-photo],[data-pick],[data-pkg],[data-now],[data-studio],[data-range],[data-grip],[data-tile],[data-cardio]');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.place) { setPlace(d.place); return renderGym(); }
  if (d.band) return SS.setBand(d.band === '0' ? null : d.band);
  if (d.photo) return PV.open(d.photo);
  if (d.play) { PL.open(d.play); PL.start(); return; }
  if (d.variant) { LS.set('morgenOverride', { date: TODAY(), v: d.variant }); return renderDehnen(); }
  if (d.pull) return pull(d.pull);
  if (d.grip) { LS.set('pullGrip', d.grip); return renderDehnen(); }
  if (d.plan) { gymSel = d.plan; return renderGym(); }
  if (d.alt) return SS.sub(d.alt);
  if (d.pick) return PK.pick(d.pick);
  if (d.pkg) return PK.setG(d.pkg);
  if (d.now) return SS.now(d.now);
  if (d.tile) return SS.pickMachine(d.tile);
  if (d.cardio) { SS.S.cardio = d.cardio; SS.saveLocal(); SS.saveRemote(); return SS.render(); }
  if (d.studio) return STD.pick(d.studio);
  if (d.range) { LS.set('statsRange', d.range); return renderStats(); }
  if (ACT[d.act]) ACT[d.act](t, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'pk-q') return PK.filter(e.target.value);
  if (e.target.id === 'sto-q') return filterRows('#sto-list', e.target.value, '#sto-none');
  if (!SS.draft) return;
  if (e.target.id === 'in-kg' || e.target.id === 'in-reps') { const d = SS.readDraft(); SS.draft.kg = d.kg ?? ''; SS.draft.reps = d.reps ?? ''; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'pk-cam') { PK.onPhoto(e.target.files && e.target.files[0]); e.target.value = ''; return; }
  if (e.target.id !== 'in-setting') return;
  const id = e.target.dataset.ex, v = e.target.value.trim();
  if ((D.machines[id]?.setting || '') === v) return;
  D.machines[id] = { ...(D.machines[id] || {}), setting: v, updatedAt: new Date().toISOString() };
  Store.put('machines/' + id, D.machines[id]);
  toast('Setting saved.');
});
document.addEventListener('keydown', e => {
  if (!$('#pv').hidden) { if (e.key === 'Escape') PV.close(); else if (e.key === 'ArrowRight') PV.step(1); else if (e.key === 'ArrowLeft') PV.step(-1); return; }
  if (!PL.active || e.target.closest('input')) return;
  if (e.key === ' ') { e.preventDefault(); PL.toggle(); }
  else if (e.key === 'ArrowRight') PL.next();
  else if (e.key === 'ArrowLeft') PL.prev();
  else if (e.key === 'Escape') PL.close();
});

// ---------- Start ----------
function renderAll() { renderDehnen(); renderGym(); if (tab === 'stats') renderStats(); renderTestbar(); }
function boot() {
  $('#today').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch {}
  for (const t of ['dehnen', 'gym', 'stats']) $('#ti-' + t).innerHTML = ICON[{ dehnen: 'stretch', gym: 'gym', stats: 'stats' }[t]];
  if (TEST) { testSeed(); document.title = 'Test · Stretch & Gym'; }
  setSync();
  $('#pv-x').innerHTML = ICON.close;
  Photos.load();
  try { loadAll(); } catch (e) { console.warn(e); toast('Could not read saved data.'); }
  setTab(tab); renderAll(); route();
  // Sync when the app opens, comes back to the front, gets internet, or is left with unsent changes.
  Sync.run();
  window.addEventListener('online', () => Sync.run());
  window.addEventListener('offline', () => setSync());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' || Sync.status().pending) Sync.run(); });
  setInterval(() => { if (document.visibilityState === 'visible') Sync.run(); }, 5 * 60e3);
  // Offline support: the service worker keeps a copy of the app on the phone.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('App updated. The new version loads next time you open it.'); });
  }
}
boot();
